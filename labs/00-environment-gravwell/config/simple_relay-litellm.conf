# litellm log listener: Lab 05 Part 1 (M8).
# Drop into the Gravwell etc volume at: /opt/gravwell/etc/simple_relay.conf.d/litellm.conf
#
# NO Reader-Type on purpose: this takes whatever litellm's container emits as RAW LINE-DELIMITED
# TEXT. This is not a syslog pipeline, it is a peek at what a generic gateway records.
# Not parsing means we don't care that docker's syslog driver speaks RFC3164 by default, and the
# priority prefix (<30>1 ...) just rides along in the text where you can see it.
#
# OWN PORT on purpose: the stock image already defines syslogtcp (601) and syslogudp (514).
# Binding either of those again fails config validation -> simple_relay exits -> the manager sleeps
# 10 minutes -> EVERY ingest listener dies silently. Don't.
#
# TCP on purpose: the docker syslog driver connects at container start, so if Gravwell is down
# litellm fails loudly instead of black-holing its logs into UDP.
[Listener "litellm"]
	Bind-String="0.0.0.0:7709"
	Tag-Name=syslog
	Ignore-Timestamps=true
