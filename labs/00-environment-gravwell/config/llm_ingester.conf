# Gravwell LLM ingester: per-seat sidecar config (mounted read-only into the llm-ingester
# container by docker-compose.yml). Ingest secret + indexer target come from the container env
# (GRAVWELL_INGEST_SECRET, GRAVWELL_CLEARTEXT_TARGETS), so nothing secret lives in this file.
#
# Two listeners, both forwarding to Anthropic (the class API key is an Anthropic key):
#   :4180  OpenAI-compatible  (/v1/chat/completions)  -> Anthropic's OpenAI-compat layer
#   :4181  Anthropic Messages (/v1/messages)          -> Anthropic native (Claude Code, SDKs)
# Published on the host as <WORKSHOPUID>80 and <WORKSHOPUID>81.
# Clients present their own key (ANTHROPIC_API_KEY from ~/.workshop_env) and it is passed through.
# To hide the real key behind the proxy instead, set Upstream-Authorization on a listener and use
# Client-Authorization to gate access: that is the M9 "gateway" discussion point.

[Global]
	Connection-Timeout = 0
	Insecure-Skip-TLS-Verify = false
	Log-Level = INFO
	Log-File = /opt/gravwell/log/llm_ingester.log
	State-Store-Location = /opt/gravwell/etc/llm_ingester.state
	Session-Match-Window = 10

[Listener "openai"]
	Bind = ":4180"
	Upstream-URL = "https://api.anthropic.com"
	Protocol = "openai-chat"
	Tag-Name = llm
	Log-Mode = "delta"
	Log-Tool-Calls = true
	Log-Usage = true
	Session-TTL = "30m"
	Insecure-Skip-TLS-Verify-Upstream = false

[Listener "anthropic"]
	Bind = ":4181"
	Upstream-URL = "https://api.anthropic.com"
	Protocol = "anthropic-messages"
	Tag-Name = llm
	Auth-Style = "x-api-key"
	Anthropic-Version = "2023-06-01"
	Session-ID-Header = "x-claude-code-session-id"
	Log-Mode = "delta"
	Log-Tool-Calls = true
	Log-Usage = true
	Session-TTL = "30m"
	Insecure-Skip-TLS-Verify-Upstream = false
