# Ingest listener for Lab 07's flag: five secrets that no agent should ever be handed.
# Drop into the Gravwell etc volume at: /opt/gravwell/etc/simple_relay.conf.d/flag.conf
#
#   nc -q1 localhost ${WORKSHOPUID}15 < ~/jarvis/labs/07-mcp-tool-interaction/flag.txt
#
# The lines are syslog with a fixed date; Ignore-Timestamps stamps them with the time of ingest
# instead, so "last hour" finds them whenever the lab is run.
[Listener "flag"]
	Bind-String="0.0.0.0:7715"
	Tag-Name=flag
	Ignore-Timestamps=true
