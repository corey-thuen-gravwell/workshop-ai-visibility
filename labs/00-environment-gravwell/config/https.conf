# HTTPS override, layered into /opt/gravwell/etc/gravwell.conf.d/https.conf
# Serves the Gravwell UI over HTTPS on 443 with the mounted cert/key.
# (Image default is HTTP on :80; this box is reached over the internet, so TLS matters.)
[global]
Web-Port=443
Insecure-Disable-HTTPS=false
Certificate-File=/opt/gravwell/etc/cert.pem
Key-File=/opt/gravwell/etc/key.pem
