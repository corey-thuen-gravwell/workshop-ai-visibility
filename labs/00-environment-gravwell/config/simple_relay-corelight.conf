# Ingest listeners for the analysis labs. Drop-in for /opt/gravwell/etc/simple_relay.conf.d/.
# One line-delimited listener per tag; `nc` each file in:
#   nc localhost ${WORKSHOPUID}01 < corelight_dns.jsonl     (02 ssl, 03 conn, 04 http, 06 okta, 07 sysmon)
# Timestamps are EXTRACTED from the records (Zeek ISO `ts`, Okta `published`, Sysmon `SystemTime`)
# so the generated one-day narrative keeps its timeline: search "last 48 hours".
# The scenario sits in the previous UTC business day; in class the data is regenerated for you.
[Listener "corelight_dns"]
	Bind-String="0.0.0.0:7701"
	Tag-Name=corelight_dns
	Timestamp-Format-Override="RFC3339"
[Listener "corelight_ssl"]
	Bind-String="0.0.0.0:7702"
	Tag-Name=corelight_ssl
	Timestamp-Format-Override="RFC3339"
[Listener "corelight_conn"]
	Bind-String="0.0.0.0:7703"
	Tag-Name=corelight_conn
	Timestamp-Format-Override="RFC3339"
[Listener "corelight_http"]
	Bind-String="0.0.0.0:7704"
	Tag-Name=corelight_http
	Timestamp-Format-Override="RFC3339"
[Listener "okta"]
	Bind-String="0.0.0.0:7706"
	Tag-Name=okta
	Timestamp-Format-Override="RFC3339"
[Listener "sysmon"]
	Bind-String="0.0.0.0:7707"
	Tag-Name=sysmon
	Timestamp-Format-Override="RFC3339"
