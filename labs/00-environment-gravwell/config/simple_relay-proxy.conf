# Ingest listener for the vendor-agnostic Python logging proxy (src/logging-proxy/llm_audit_proxy.py).
# Drop into the Gravwell etc volume at: /opt/gravwell/etc/simple_relay.conf.d/proxy.conf
# The proxy ships newline-delimited JSON events over TCP:
#   llm_audit_proxy.py --tcp localhost:${WORKSHOPUID}05 ...
# Timestamps are taken from the event's own "ts" field (ISO-8601) so replayed captures keep their times.
[Listener "proxy"]
	Bind-String="0.0.0.0:7705"
	Tag-Name=proxy
	Timestamp-Format-Override="RFC3339"

# Gravwell AI-assistant ("Logbot") audit logs for the AI-assistant-audit lab. RFC5424 syslog.
# In production these live in tag=gravwell (filter by MsgID ~ "ai.go"); we isolate them to tag=logbot
# so the workshop data doesn't drown in the seat's own Gravwell self-logs.
#   nc localhost ${WORKSHOPUID}08 < logbot.log
[Listener "logbot"]
	Bind-String="0.0.0.0:7708"
	Tag-Name=logbot
	Timestamp-Format-Override="RFC3339"
