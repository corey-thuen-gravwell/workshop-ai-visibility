# Ingest listener for the student's own MCP server (src/mcp-lab-server/).
# Drop into the Gravwell etc volume at: /opt/gravwell/etc/simple_relay.conf.d/mcp.conf
#
# The lab server ships every JSON-RPC message it sends or receives as newline-delimited JSON:
#   ./mcp_lab_server.py --config my-server.toml --tcp localhost:${WORKSHOPUID}10
#
# Entries are stamped with the time of arrival, not with a timestamp found in the entry. The server
# streams each line the moment it is logged, so arrival time is the record's own `ts` to within
# milliseconds. Extracting it instead went wrong in Lab 07: a tool-call record whose arguments
# carried ten entries from every tag was filed under a timestamp from inside the stolen data, a day
# in the past, and a "last 2 hours" search could not find the one record that proved the theft.
[Listener "mcp"]
	Bind-String="0.0.0.0:7710"
	Tag-Name=mcp
	Ignore-Timestamps=true
