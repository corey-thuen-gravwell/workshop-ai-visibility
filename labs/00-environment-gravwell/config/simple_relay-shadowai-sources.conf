# Ingest listeners for the "Shadow AI beyond the wire" lab (labs/_stretch/shadow-ai-sources/).
# Drop-in for /opt/gravwell/etc/simple_relay.conf.d/. Four sources Lab 02's network data cannot see;
# same cast of hosts and people. Students `nc` each file in:
#   nc -q1 localhost ${WORKSHOPUID}11 < osquery_results.jsonl     (12 swg, 13 cloudtrail, 14 gws)
# Timestamps are EXTRACTED from the records so the one-day narrative keeps its timeline (search "last 48 hours"):
#   osquery    calendarTime   "Tue Sep  8 13:41:02 2026 UTC"   (osquery's native format = Go ANSIC + zone)
#   swg        time           RFC3339 (ms)
#   cloudtrail eventTime      RFC3339
#   gws        id.time        RFC3339 (ms)
# Same day and cast as the Lab 02 data; in class both are regenerated for you before the day starts.
[Listener "osquery"]
	Bind-String="0.0.0.0:7711"
	Tag-Name=osquery
	Timestamp-Format-Override="AnsiC"
[Listener "swg"]
	Bind-String="0.0.0.0:7712"
	Tag-Name=swg
	Timestamp-Format-Override="RFC3339"
[Listener "cloudtrail"]
	Bind-String="0.0.0.0:7713"
	Tag-Name=cloudtrail
	Timestamp-Format-Override="RFC3339"
[Listener "gws"]
	Bind-String="0.0.0.0:7714"
	Tag-Name=gws
	Timestamp-Format-Override="RFC3339"
