# Workshop share server. Static PDFs over HTTPS, behind basic auth, with directory browsing.
#
# Deliberately dumb: no generated index, no application code, no dynamic anything. The listing IS
# nginx's autoindex, so a file appears the moment an instructor copies it into live/ and there is
# nothing to regenerate or to get out of sync.
#
# Basic auth is here because this is on the public internet: it keeps crawlers and drive-by bots
# off the course material. It is not a secret-keeping measure; it is a "don't index my PDFs" measure.

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;      # so "<lab-host>/labs" works when read aloud
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /srv/share;
    charset utf-8;
    server_tokens off;

    # Well-behaved crawlers stop here; the rest are stopped by auth below.
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        auth_basic           "Exploring AI Visibility, workshop materials";
        auth_basic_user_file /etc/nginx/.htpasswd;

        autoindex            on;
        autoindex_exact_size off;
        autoindex_localtime  on;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

        # PDFs open in the browser rather than downloading; the .html twins render in place.
        types { application/pdf pdf; text/html html; }
        default_type application/octet-stream;
    }
}
