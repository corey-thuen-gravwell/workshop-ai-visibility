# Workshop share server: nginx serving live/ with basic auth, behind the host's Traefik.
#
# The lab host already runs Traefik on :80/:443 (/opt/webstack/stack), so this container publishes
# no ports. It joins Traefik's network and is routed by Host(SHARE_HOST); Traefik terminates TLS
# with its own Let's Encrypt cert (HTTP-01) and redirects http -> https. nginx speaks plain HTTP.
#
# Everything it needs is a bind mount, so this is portable: point SHARE_ROOT somewhere else and it
# runs anywhere docker + that Traefik does. Nothing is baked into an image.
#
# Brought up by instructor/runbook/scripts/start-share-server.sh, which also writes .htpasswd.
#
#   live/      is the web root, ONLY what an instructor has published
#   staged/    is NOT mounted, so unpublished material is not merely hidden, it is unreachable

name: workshopshare

services:
  share:
    image: nginx:alpine
    container_name: workshop-share
    restart: unless-stopped
    networks: [edge]
    volumes:
      - ${SHARE_ROOT:-/opt/workshop/share}/live:/srv/share:ro
      - ${SHARE_CONF:-./nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${SHARE_ROOT:-/opt/workshop/share}/.htpasswd:/etc/nginx/.htpasswd:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.workshop-share.rule=Host(`${SHARE_HOST:?set SHARE_HOST, e.g. share.jarvis.gravwell.space}`)
      - traefik.http.routers.workshop-share.entrypoints=websecure
      - traefik.http.services.workshop-share.loadbalancer.server.port=80

networks:
  edge:
    name: ${TRAEFIK_NETWORK:-webstack-edge}
    external: true
